; SkyRadar — traffico aereo in tempo reale sopra la tua testa
; Scheda di riferimento: ESP32-2432S028R "Cheap Yellow Display" (CYD)
;   ESP32-WROOM-32, display ILI9341 2.8" 320x240, LED RGB, tasto BOOT

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0          ; Arduino core 2.0.x (TFT_eSPI non supporta ancora bene il core 3.x)
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv ; 3 MB per l'app (TLS + WiFiManager + font)
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.2.1
  tzapu/WiFiManager@^2.0.17

; Configurazione TFT_eSPI passata via build flag (niente User_Setup.h da modificare a mano)
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DWM_MDNS=1                          ; http://skyradar.local
  -DUSER_SETUP_LOADED=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1     ; il touch XPT2046 della CYD non passa da TFT_eSPI
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000

; CYD classica (una sola porta micro-USB)
[env:cyd]
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER=1

; CYD "2USB" (micro-USB + USB-C): stesso pannello ma con colori invertiti
[env:cyd2usb]
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER=1
  -DTFT_INVERSION_ON=1
